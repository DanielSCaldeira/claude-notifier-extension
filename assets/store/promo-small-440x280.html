<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Promo Small 440x280</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 440px;
    height: 280px;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0F172A;
  }

  .card {
    width: 440px;
    height: 280px;
    background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 44px;
    position: relative;
    overflow: hidden;
  }

  /* Decorative background circles */
  .bg-circle-1 {
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(37,99,235,0.15) 0%, transparent 70%);
    top: -60px;
    left: -60px;
  }
  .bg-circle-2 {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(34,197,94,0.12) 0%, transparent 70%);
    bottom: -40px;
    right: -40px;
  }

  /* Icon */
  .icon-wrap {
    width: 52px;
    height: 52px;
    border-radius: 13px;
    overflow: hidden;
    margin-bottom: 14px;
    box-shadow: 0 4px 24px rgba(37,99,235,0.4), 0 2px 8px rgba(0,0,0,0.5);
    display: flex;
    flex-shrink: 0;
  }
  .icon-left {
    width: 50%;
    height: 100%;
    background: #2196F3;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 2px;
  }
  .icon-right {
    width: 50%;
    height: 100%;
    background: #4CAF50;
  }
  .icon-c {
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -1px;
  }

  .title {
    font-size: 20px;
    font-weight: 700;
    color: #F1F5F9;
    letter-spacing: -0.3px;
    margin-bottom: 6px;
    text-align: center;
  }

  .subtitle {
    font-size: 13px;
    color: #94A3B8;
    text-align: center;
    line-height: 1.5;
    max-width: 340px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="bg-circle-1"></div>
  <div class="bg-circle-2"></div>

  <div class="icon-wrap">
    <div class="icon-left"><span class="icon-c">c</span></div>
    <div class="icon-right"></div>
  </div>

  <div class="title">Claude Notifier Pro</div>
  <div class="subtitle">Get notified the instant your Claude<br>usage window resets.</div>
</div>
</body>
</html>
